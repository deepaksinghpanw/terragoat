name: Full CI/CD Scan and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  # Global variables (used by all jobs)
  CORTEX_API_URL: https://api-e-cxsiamp.xdr.us.paloaltonetworks.com
  IMAGE_NAME: deepak-terragoat-app
  AWS_ECR_REPOSITORY: cc-demo/my-terragoat-app
  AWS_REGION: ${{ secrets.AWS_REGION }}
  CORTEX_API_KEY: ${{secrets.CORTEX_API_KEY}}
  CORTEX_API_KEY_ID: ${{secrets.CORTEX_API_KEY_ID}}

jobs:
  # --- JOB 1: SCAN TERRAFORM CODE ---
  code-scan:
    name: 1. Scan Terraform Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install jq
        run: |
          echo ">>> [Job 1] Installing dependencies (jq)..."
          sudo apt-get update && sudo apt-get install -y jq
          echo ">>> [Job 1] jq installed."

      - name: Download cortexcli
        run: |
          echo ">>> [Job 1] Downloading Cortex CLI..."
          set -x
          crtx_resp=$(curl -s "${CORTEX_API_URL}/public_api/v1/unified-cli/releases/download-link?os=linux&architecture=amd64" \
            -H "x-xdr-auth-id: ${CORTEX_API_KEY_ID}" \
            -H "Authorization: ${CORTEX_API_KEY}")
          crtx_url=$(echo $crtx_resp | jq -r ".signed_url")
          curl -L -o cortexcli $crtx_url
          chmod +x cortexcli
          set +x
          echo ">>> [Job 1] Cortex CLI downloaded and made executable."

      - name: Run Cortex CLI Code Scan
        run: |
          echo "------------------------------------------"
          echo ">>> [Job 1] Starting Cortex code scan..."
          echo "------------------------------------------"
          
          time ./cortexcli \
            --api-base-url "${CORTEX_API_URL}" \
            --api-key "${CORTEX_API_KEY}" \
            --api-key-id "${CORTEX_API_KEY_ID}" \
            code scan \
            --directory "${{github.workspace}}" \
            --repo-id "${{github.repository}}" \
            --branch "${{github.ref_name}}" \
            --source "GITHUB_ACTIONS" \
            --create-repo-if-missing
            
          echo "------------------------------------------"
          echo ">>> [Job 1] Code scan finished."
          echo "------------------------------------------"

  # --- JOB 2: SCAN DOCKER IMAGE ---
  image-scan:
    name: 2. Scan Docker Image
    runs-on: ubuntu-latest
    needs: code-scan 
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Dependencies
        run: |
          echo ">>> [Job 2] Installing dependencies (jq, libhyperscan5, prelink)..."
          sudo apt-get update
          sudo apt-get install -y jq libhyperscan5 prelink
          echo ">>> [Job 2] Dependencies installed."

      - name: Download cortexcli
        run: |
          echo ">>> [Job 2] Downloading Cortex CLI..."
          set -x
          crtx_resp=$(curl -s "${CORTEX_API_URL}/public_api/v1/unified-cli/releases/download-link?os=linux&architecture=amd64" \
            -H "x-xdr-auth-id: ${CORTEX_API_KEY_ID}" \
            -H "Authorization: ${CORTEX_API_KEY}")
          crtx_url=$(echo $crtx_resp | jq -r ".signed_url")
          curl -L -o cortexcli $crtx_url
          chmod +x cortexcli
          set +x
          echo ">>> [Job 2] Cortex CLI downloaded and made executable."

      - name: Build Docker Image
        run: |
          echo ">>> [Job 2] Building local Docker image: ${{ env.IMAGE_NAME }}:latest"
          docker build -t ${{ env.IMAGE_NAME }}:latest .
          echo ">>> [Job 2] Local image build complete."

      - name: Save Image to .tar Archive
        run: |
          echo ">>> [Job 2] Saving image to ${{ env.IMAGE_NAME }}.tar"
          docker save -o ${{ env.IMAGE_NAME }}.tar ${{ env.IMAGE_NAME }}:latest
          echo ">>> [Job 2] Image saved."

      - name: Set up Java 11
        run: |
          echo ">>> [Job 2] Installing Java 11..."
          sudo apt-get update
          sudo apt-get install -y openjdk-11-jre
          java -version
          echo ">>> [Job 2] Java 11 installed."
    
      - name: Run Cortex CLI Image Scan
        run: |
          echo "------------------------------------------"
          echo ">>> [Job 2] Starting Cortex image scan (archive method)..."
          echo "------------------------------------------"
          
          # ---
          # FIXED: Replaced --log-level with --support for debug logging
          # ---
          time sudo ./cortexcli \
            --api-base-url "${CORTEX_API_URL}" \
            --api-key "${CORTEX_API_KEY}" \
            --api-key-id "${CORTEX_API_KEY_ID}" \
            --support \
            image scan \
            --archive ${{ env.IMAGE_NAME }}.tar \
            --source "GITHUB_ACTIONS"
            
          echo "------------------------------------------"
          echo ">>> [Job 2] Image scan finished."
          echo "------------------------------------------"

  # --- JOB 3: BUILD, PUSH, AND DEPLOY ---
  deploy:
    name: 3. Build, Push, and Deploy
    runs-on: ubuntu-latest
    needs: [code-scan, image-scan]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log AWS credential configuration
        run: echo ">>> [Job 3] Configuring AWS credentials..."

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }} 
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        run: |
          echo ">>> [Job 3] Logging into AWS ECR..."
          # This command dynamically gets your AWS Account ID
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
          echo ">>> [Job 3] ECR login successful."
          echo "registry=$AWS_ACCOUNT_ID.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com" >> $GITHUB_OUTPUT

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo ">>> [Job 3] Building and tagging image for ECR..."
          docker build -t $ECR_REGISTRY/$AWS_ECR_REPOSITORY:$IMAGE_TAG .
          echo ">>> [Job 3] Pushing image to ECR: $ECR_REGISTRY/$AWS_ECR_REPOSITORY:$IMAGE_TAG"
          docker push $ECR_REGISTRY/$AWS_ECR_REPOSITORY:$IMAGE_TAG
          echo "image_uri=$ECR_REGISTRY/$AWS_ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo ">>> [Job 3] Image push complete."

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: |
          echo ">>> [Job 3] Running terraform init..."
          terraform init
          echo ">>> [Job 3] Terraform init complete."

      - name: Terraform Apply
        run: |
          echo ">>> [Job 3] Running terraform apply..."
          # Pass the newly built image URI as a variable to Terraform
          terraform apply -auto-approve -var="image_uri=${{ steps.build-image.outputs.image_uri }}"
          echo ">>> [Job 3] Terraform apply complete."
