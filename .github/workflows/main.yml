name: Cortex CLI - Scan Stock Image

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual triggering

# --- Define all ENV variables here for simplicity ---
# These are available to all 'run' steps in the job.
env:
  CORTEX_API_URL: https://api-e-cxsiamp.xdr.us.paloaltonetworks.com
  IMAGE_NAME: python:3.10-slim  # --- The stock image to pull and scan ---

jobs:
  scan-stock-image:
    name: Scan Stock Image
    runs-on: ubuntu-22.04

    steps:
      # Step 1: Install dependencies
      # - jq: For parsing the API response to get the download URL
      # - libhyperscan5: Required by the Cortex scanner
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq libhyperscan5

     # Step 2: Download the Cortex CLI
      - name: Download Cortex CLI
        run: |
          echo "Downloading Cortex CLI..."
          # Use secrets for authentication
          # The "Authorization" header MUST start with "Bearer "
          crtx_resp=$(curl -s "${CORTEX_API_URL}/public_api/v1/unified-cli/releases/download-link?os=linux&architecture=amd64" \
            -H "x-xdr-auth-id: ${{ secrets.CORTEX_API_KEY_ID }}" \
            -H "Authorization: Bearer ${{ secrets.CORTEX_API_KEY }}")
          
          # Parse the signed URL from the JSON response
          crtx_url=$(echo $crtx_resp | jq -r ".signed_url")

          # Fail-safe to check if the URL was retrieved
          if [ -z "$crtx_url" ] || [ "$crtx_url" == "null" ]; then
            echo "::error::Failed to get CLI download link. Check API keys and permissions."
            echo "Response from server:"
            echo $crtx_resp
            exit 1
          fi

          # Download the CLI binary
          echo "Download link retrieved. Downloading binary..."
          curl -L -o cortexcli $crtx_url
          chmod +x cortexcli
          echo "Cortex CLI downloaded successfully."

      # Step 3: Pull the stock image to the local runner
      - name: Pull Stock Docker Image
        run: |
          echo "Pulling stock Docker image: $IMAGE_NAME"
          docker pull $IMAGE_NAME
          docker images

      # Step 4: Run the scan
      # We must use 'sudo' so the CLI can access the Docker socket
      # and write to its default log directory (/root/.cortexcli)
      - name: Run Cortex CLI Image Scan
        run: |
          echo "Starting Cortex image scan..."
          time sudo ./cortexcli \
            --api-base-url "${CORTEX_API_URL}" \
            --api-key "${{ secrets.CORTEX_API_KEY }}" \
            --api-key-id "${{ secrets.CORTEX_API_KEY_ID }}" \
            image scan \
            $IMAGE_NAME \
            --source "GITHUB_ACTIONS"

      # Step 5: (Optional) Display logs on failure
      # This step only runs if the 'Run Cortex CLI Image Scan' step fails
      - name: Display Cortex Logs on Failure
        if: failure()
        run: |
          echo "::warning::Scan step failed. Displaying Cortex CLI logs..."
          LOG_DIR="/root/.cortexcli/logs"
          
          # Check if log directory exists (it should, as scan ran w/ sudo)
          if ! sudo test -d $LOG_DIR || [ -z "$(sudo ls -A $LOG_DIR)" ]; then
            echo ">>> Log directory $LOG_DIR is empty or does not exist."
            exit 0
          fi
          
          # Get the newest log file
          LATEST_LOG_FILE=$(sudo ls -t $LOG_DIR | head -n1)
          FULL_LOG_PATH="$LOG_DIR/$LATEST_LOG_FILE"
          
          echo ">>> Displaying contents of $FULL_LOG_PATH"
          sudo cat $FULL_LOG_PATH
          echo ">>> End of log."
